<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bukz — books dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ec3013'/%3E%3Ctext x='8' y='12' font-size='11' font-weight='bold' text-anchor='middle' fill='%23fff' font-family='Arial'%3Eb%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    const saved = localStorage.getItem('bukz-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  </script>
</head>
<body>
  <header id="topbar">
    <div class="topbar-wrap">
      <a class="brand" href="#/checkpoint"><span class="mark"></span>bukz</a>
      <nav id="tabs" aria-label="Views"></nav>
      <div id="meta"></div>
      <button class="theme-toggle" id="theme-toggle" title="Switch light/dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button id="refresh" title="Re-fetch data and re-render">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>refresh
      </button>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal-root" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
